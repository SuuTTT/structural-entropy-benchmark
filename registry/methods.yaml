# SE Benchmark Suite — Method Registry
#
# Single source of truth for which ORIGINAL upstream repository implements each
# method, plus the pinned commit we reproduce. Reproduction policy: run the
# authors' published code as-is; wrap only I/O for the shared harness.
#
# verified: URL responded to `git ls-remote` on 2026-06-02 (recorded in notes).
#   to-locate: paper exists, canonical public repo not yet pinned.
#   none: authors released no code (must be stated as a limitation, not faked).
#
# commit: filled in when the repo is cloned to the staging area and pinned.
# Until a method has a results JSON under suite/results/, it has NO reported number.

community_detection:
  deDoc:
    paper: "Li et al., Deciphering the genomic code... (deDoc), Nature Comms 2018"
    lang: Java
    repo: https://github.com/yinxc/structural-information-minimisation
    verified: true
    commit: null
    notes: "Founding SE minimization. v1.1 benchmark marked it O(N^3)/infeasible N>50 — verify against original which claims O(n log^2 n)."
  deDoc2:
    paper: "Li et al., deDoc2, 2023"
    lang: Java
    repo: https://github.com/zengguangjie/deDoc2
    verified: true
    commit: null
  SEP_HCSE:
    paper: "Wu et al., Structural Entropy Guided Graph Hierarchical Pooling (SEP), ICML 2022; HCSE coding tree (Pan et al. 2021)"
    lang: Python
    repo: https://github.com/Wu-Junran/SEP
    verified: true
    commit: null
    notes: "Provides both SEP pooling AND the HCSE coding-tree builder. v1.1 crippled HCSE to a binary tree (target_k=2) — original is depth-unlimited. Rerun original."
  SuperTAD:
    paper: "Zhang et al., SuperTAD, Genome Biology 2021"
    lang: C++
    repo: https://github.com/deepomicslab/SuperTAD
    verified: true
    commit: null
    notes: "Hi-C contiguity constraint; bioinformatics protocol, not generic graph clustering."
  SEAT:
    paper: "Chen et al., PYSEAT, 2022"
    lang: Python
    repo: https://github.com/deepomicslab/SEAT
    verified: true
    commit: null
  LSENet:
    paper: "Sun et al., LSEnet: Lorentz Structural Entropy Neural Network, ICML 2024 (Oral)"
    lang: Python/PyTorch
    repo: https://github.com/RiemannGraph/DSE_clustering
    repo_old: https://github.com/ZhenhHuang/LSEnet  # README-only stub; code MOVED here
    verified: true
    commit: 1930d74  # cloned 2026-06-02
    entry: "main.py (configs/); hyperbolic, GPU. Now part of IsoSEL line."
    notes: "Differentiable SE in hyperbolic space; GPU. Feature-augmented deep graph clustering."
  CoDeSEG:
    paper: "Xian et al., Community Detection as a Structural-Entropy Game (CoDeSEG), WWW 2025"
    lang: C++
    repo: https://github.com/SELGroup/CoDeSEG
    verified: true
    commit: null
    notes: "Overlapping communities; needs overlapping NMI/F1 metrics, not disjoint ARI."
  DeSE:
    paper: "Zhang et al., DeSE: soft-assignment structural entropy, 2025"
    lang: Python
    repo: https://github.com/SELGroup/DeSE
    verified: true
    commit: null
    notes: "FACT-FIX: v1.1 benchmark claims 'no public code is available' — FALSE, repo exists and resolves. Reproduce it."
  SSE:
    paper: "Zeng et al., Semi-supervised SE (SSE), 2024"
    lang: Python
    repo: https://github.com/SELGroup/SSE
    verified: true
    commit: null
    notes: "Semi-supervised (takes label subset) — needs its own protocol, not unsupervised ARI."
  SSSE:
    paper: "Zeng et al., Scalable semi-supervised SE (SSSE), 2024"
    lang: Python
    repo: https://github.com/SELGroup/SSSE
    verified: true
    commit: null

