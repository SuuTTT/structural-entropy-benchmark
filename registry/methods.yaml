baselines:
  # Non-SE reference methods for fair comparison (R2: 'comparison with other graph metrics').
  community: [louvain, leiden, infomap, spectral_normalized_cut, DMoN, MinCutPool, DiffPool]
  graph_learning: [GCN, GIN, GAT, TopK_pool, SAGPool, ASAP, GraphCL, no_pool_baseline]
  rl: [vanilla_PPO, vanilla_QMIX, ICM_intrinsic, RND_intrinsic, option_critic]
